name: 部署到 GitHub Pages

# 为什么用 Actions 而不是「Deploy from a branch」：
# legacy 分支部署在本仓库会报 "Page build failed." 且拿不到具体错误，
# Actions 部署直接上传现成产物，没有多余的转换步骤，失败时也有完整日志。
#
# 注意：本工作流**不构建**。仓库根目录放的就是已构建好的静态文件
# （由本地 `pnpm deploy` 通过 GitHub API 提交），这里只负责发布。
# 好处是不用在 CI 里重装依赖，也不依赖 pnpm-lock 的完整性。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        name: 发布
        uses: actions/deploy-pages@v4
